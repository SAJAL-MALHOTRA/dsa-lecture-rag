name: Render Free Tier Keep-Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render free instance from spinning down (15-min idle timeout)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  keep-alive:
    name: Ping Render Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Ping Striver DSA Platform
        run: |
          echo "Sending keep-alive ping to https://striver-dsa-platform.onrender.com/api/health..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://striver-dsa-platform.onrender.com/api/health || echo "000")
          echo "Received HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Render instance is active and warm! (HTTP 200)"
          else
            echo "Instance may be waking up from cold sleep (HTTP $HTTP_STATUS). Retrying in 15 seconds..."
            sleep 15
            RETRY_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://striver-dsa-platform.onrender.com/api/health || echo "000")
            echo "Retry response: $RETRY_STATUS"
          fi
